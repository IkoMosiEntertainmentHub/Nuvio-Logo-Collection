<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visual Assets Library</title>

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: auto;
    padding: 30px;
}

input {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    margin-bottom: 20px;
}

.card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 10px;
}

</style>

</head>


<body>

<h1>Visual Assets Library</h1>

<input id="search" placeholder="Search collections...">

<div id="results">
Loading...
</div>


<script>

let assets = [];


const database =
"https://ikomosientertainmenthub.github.io/Visual-Assets-Library/search.json";



fetch(database)

.then(response => {

    console.log("Response:", response);

    if (!response.ok) {

        throw new Error(
            "Failed loading database: " + response.status
        );

    }

    return response.json();

})


.then(data => {


    console.log("Database loaded:", data);


    assets = data;


    displayResults(assets);


})


.catch(error => {


    console.error(error);


    document.getElementById("results").innerHTML =
    "Failed to load search database.";


});





document
.getElementById("search")
.addEventListener(
"input",
function(){


    let query =
    this.value.toLowerCase();


    let results =
    assets.filter(item =>

        item.name.toLowerCase().includes(query)
        ||
        item.category.toLowerCase().includes(query)

    );


    displayResults(results);


});





function displayResults(results){


    let container =
    document.getElementById("results");


    container.innerHTML = "";



    if(results.length === 0){

        container.innerHTML =
        "No collections found.";

        return;

    }



    results.forEach(item => {


        container.innerHTML += 

        <div class="card">

        <h2>${item.name}</h2>

        <p>
        Category: ${item.category}
        </p>

        <p>
        Status: ${item.status}
        </p>

        </div>

        ;


    });


}


</script>


</body>

</html>
