<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visual Assets Library</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    padding: 40px;
    overflow-x: hidden;
    background: #050b18;

}


body::before {

    content: "";

    position: fixed;

    width: 700px;
    height: 700px;

    background: #0066ff;

    filter: blur(160px);

    opacity: 0.35;

    top: -200px;
    left: -200px;

    animation: move 12s infinite alternate;

    z-index: -1;

}


body::after {

    content: "";

    position: fixed;

    width: 600px;
    height: 600px;

    background: #00bfff;

    filter: blur(170px);

    opacity: 0.25;

    bottom: -200px;
    right: -200px;

    animation: move2 15s infinite alternate;

    z-index: -1;

}


@keyframes move {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(300px,200px);
    }

}


@keyframes move2 {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(-250px,-200px);
    }

}


.container {

    max-width: 1100px;
    margin: auto;

}


h1 {

    font-size: 40px;

}


input {

    width: 100%;

    padding: 16px;

    border-radius: 12px;

    border: none;

    background: #111c33;

    color: white;

    font-size: 18px;

    margin-bottom: 25px;

}


.card {

    background: rgba(20,30,55,0.8);

    backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.1);

    border-radius: 16px;

    padding: 20px;

    margin-bottom: 20px;

}


.complete {

    color: #00ff88;

    font-weight: bold;

}


.dev {

    color: #ffaa00;

    font-weight: bold;

}


.notstarted {

    color: gray;

    font-weight: bold;

}


button {

    background: #0066ff;

    border: none;

    color: white;

    padding: 10px 15px;

    border-radius: 8px;

    cursor: pointer;

}


button:hover {

    background: #008cff;

}


.asset {

    background: #081226;

    padding: 10px;

    border-radius: 8px;

    margin-top: 10px;

    word-break: break-all;

}


</style>

</head>


<body>


<div class="container">


<h1>
Visual Assets Library
</h1>


<input 
id="search"
placeholder="Search collections..."
>


<div id="results">

Loading...

</div>


</div>



<script>


let assets = [];



const DATABASE = "search.json";



fetch(DATABASE)

.then(response => {


    if(!response.ok){

        throw new Error(
            "Database loading failed: "
            + response.status
        );

    }


    return response.json();


})


.then(data => {


    assets = data;

    displayResults(data);


})


.catch(error => {


    console.error(error);


    document.getElementById("results").innerHTML =
    "Failed loading database";


});





document
.getElementById("search")
.addEventListener(
"input",
function(){


    let query = this.value
    .toLowerCase()
    .trim();



    let filtered = assets.filter(item =>


        item.name
        .toLowerCase()
        .includes(query)


        ||

        item.category
        .toLowerCase()
        .includes(query)


        ||

        item.status
        .toLowerCase()
        .includes(query)


    );



    displayResults(filtered);


});





function copyText(text, button){


    navigator.clipboard.writeText(text);


    button.innerText = "Copied";


    setTimeout(() => {

        button.innerText = "Copy Link";

    },1500);


}





function displayResults(data){


    let box = document
    .getElementById("results");



    box.innerHTML = "";



    if(data.length === 0){


        box.innerHTML =
        "<p>No collections found.</p>";


        return;


    }





    data.forEach(item => {



        let statusClass = "dev";



        if(item.status === "Complete"){

            statusClass = "complete";

        }


        else if(item.status === "Not Started"){

            statusClass = "notstarted";

        }





        let html = `


        <div class="card">


        <h2>
        ${item.name}
        </h2>


        <p>
        Category: ${item.category}
        </p>


        <p class="${statusClass}">
        Status: ${item.status}
        </p>


        `;





        if(item.status === "Complete" && item.assets){



            html += `

            <h3>
            Raw Assets
            </h3>

            `;



            item.assets.forEach(url => {


                html += `


                <div class="asset">


                ${url}


                <br><br>


                <button onclick='copyText(${JSON.stringify(url)}, this)'>

                Copy Link

                </button>


                </div>


                `;


            });



        }


        else {


            html += `


            <p>
            No assets available yet.
            </p>


            `;


        }





        html += `

        </div>

        `;



        box.innerHTML += html;



    });



}



</script>


</body>

</html>
