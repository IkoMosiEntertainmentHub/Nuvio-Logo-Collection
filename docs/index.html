<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Visual Assets Library</title>
</head>

<body>

<h1>Visual Assets Library</h1>

<input id="search" placeholder="Search..." onkeyup="searchAssets()">

<div id="results"></div>


<script>

let assets = [];


fetch("search.json")
.then(response => response.json())
.then(data => {
    assets = data;
});


function searchAssets() {

    const query = document
        .getElementById("search")
        .value
        .toLowerCase();


    const results = assets.filter(item =>
        item.name
        .toLowerCase()
        .includes(query)
    );


    displayResults(results);

}



function displayResults(results) {

    const container =
        document.getElementById("results");


    container.innerHTML = "";


    results.forEach(item => {


        container.innerHTML += 

        <div>

        <h2>${item.name}</h2>

        <p>
        Category:
        ${item.category}
        </p>

        <p>
        Status:
        ${item.status}
        </p>


        ${
            item.status === "Complete"

            ?

            <a href="https://github.com/IkoMosiEntertainmentHub/Visual-Assets-Library/tree/main/${item.path}">
            Open Folder
            </a>

            :

            No assets available yet

        }


        </div>

        <hr>

        ;


    });


}


</script>


</body>

</html>
