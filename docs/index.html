<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visual Assets Library</title>

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: auto;
    padding: 30px;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 18px;
}

.card {
    border: 1px solid #ccc;
    padding: 15px;
    margin-top: 15px;
    border-radius: 10px;
}

</style>

</head>


<body>


<h1>Visual Assets Library</h1>


<input 
id="search"
placeholder="Search collections..."
>


<div id="results">
Loading collections...
</div>



<script>


let assets = [];



async function loadSearch() {


    const response = await fetch(
        "https://ikomosientertainmenthub.github.io/Visual-Assets-Library/search.json"
    );


    assets = await response.json();


    showResults(assets);


}



function showResults(list) {


    const box =
    document.getElementById("results");


    box.innerHTML = "";


    if(list.length === 0){

        box.innerHTML =
        "<p>No results found.</p>";

        return;

    }



    list.forEach(item => {


        box.innerHTML += 

        <div class="card">

        <h2>${item.name}</h2>

        <p>
        Category: ${item.category}
        </p>

        <p>
        Status: ${item.status}
        </p>

        ${
            item.status === "Complete"
            ?
            
            <a href="https://github.com/IkoMosiEntertainmentHub/Visual-Assets-Library/tree/main/${item.path}">
            Open Folder
            </a>
            
            :
            "No assets available yet"
        }

        </div>

        ;


    });


}




document
.getElementById("search")
.addEventListener(
"input",
function(){


    let text =
    this.value
    .toLowerCase();



    let filtered =
    assets.filter(item =>


        item.name
        .toLowerCase()
        .includes(text)

        ||

        item.category
        .toLowerCase()
        .includes(text)


    );


    showResults(filtered);


});




loadSearch();


</script>


</body>

</html>
