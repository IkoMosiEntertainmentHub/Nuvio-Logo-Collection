<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visual Assets Library</title>

<style>

* {
    box-sizing:border-box;
}

body {

    margin:0;

    min-height:100vh;

    font-family:Arial,sans-serif;

    color:white;

    padding:40px;

    background:#050b18;

}


body::before {

    content:"";

    position:fixed;

    width:700px;

    height:700px;

    background:#0066ff;

    filter:blur(160px);

    opacity:.35;

    top:-200px;

    left:-200px;

    animation:move 12s infinite alternate;

    z-index:-1;

}


body::after {

    content:"";

    position:fixed;

    width:600px;

    height:600px;

    background:#00bfff;

    filter:blur(170px);

    opacity:.25;

    bottom:-200px;

    right:-200px;

    animation:move2 15s infinite alternate;

    z-index:-1;

}


@keyframes move {

from{
transform:translate(0,0);
}

to{
transform:translate(300px,200px);
}

}


@keyframes move2 {

from{
transform:translate(0,0);
}

to{
transform:translate(-250px,-200px);
}

}



.container{

max-width:1100px;

margin:auto;

}



input{

width:100%;

padding:15px;

border-radius:12px;

border:none;

background:#111c33;

color:white;

font-size:18px;

}



.options{

margin:20px 0;

background:rgba(255,255,255,.08);

padding:15px;

border-radius:12px;

}



.card{

background:rgba(20,30,55,.8);

backdrop-filter:blur(15px);

border-radius:16px;

padding:20px;

margin-top:20px;

border:1px solid rgba(255,255,255,.1);

}



.complete{

color:#00ff88;

font-weight:bold;

}



.dev{

color:#ffaa00;

font-weight:bold;

}



.asset{

background:#081226;

padding:15px;

border-radius:10px;

margin-top:15px;

}



.preview{

max-width:100%;

max-height:300px;

border-radius:10px;

margin-top:10px;

}



button{

background:#0066ff;

color:white;

border:none;

padding:10px 15px;

border-radius:8px;

cursor:pointer;

margin-top:10px;

}



button:hover{

background:#008cff;

}



</style>

</head>



<body>


<div class="container">


<h1>
Visual Assets Library
</h1>


<input id="search" placeholder="Search collections...">



<div class="options">

<label>

<input 
type="checkbox"
id="previewToggle"
checked
>

Enable Preview

</label>

</div>



<div id="results">
Loading...
</div>



</div>





<script>


let assets=[];


let showPreview=true;



const DATABASE="search.json";





fetch(DATABASE)

.then(response=>response.json())

.then(data=>{

assets=data;

displayResults(data);

})

.catch(error=>{

console.error(error);

document.getElementById("results").innerHTML=
"Failed loading database";

});





document
.getElementById("previewToggle")
.addEventListener(
"change",
function(){

showPreview=this.checked;

displayResults(assets);

});





document
.getElementById("search")
.addEventListener(
"input",
function(){


let q=this.value.toLowerCase().trim();



let filtered=assets.filter(item=>


item.name.toLowerCase().includes(q)

||

item.category.toLowerCase().includes(q)

||

item.status.toLowerCase().includes(q)


);



displayResults(filtered);



});







function copyText(text,button){


navigator.clipboard.writeText(text);


button.innerText="Copied";


setTimeout(()=>{

button.innerText="Copy Raw Asset Link";

},1500);


}








function displayResults(data){


let box=document.getElementById("results");


box.innerHTML="";



data.forEach(item=>{


let status=item.status==="Complete"
?"complete"
:"dev";



let html=`


<div class="card">


<h2>${item.name}</h2>


<p>
Category: ${item.category}
</p>


<p class="${status}">
Status: ${item.status}
</p>


`;





if(item.status==="Complete" && item.assets){



item.assets.forEach(url=>{



let extension=url.split(".").pop().toLowerCase();



let type=extension.toUpperCase();




html+=`

<div class="asset">


<h3>${type}</h3>

`;





if(showPreview){



if(
extension==="png" ||
extension==="jpg" ||
extension==="jpeg" ||
extension==="webp" ||
extension==="gif"
){


html+=`

<img 
class="preview"
src="${url}"
loading="lazy"
>


`;

}


else if(
extension==="mp4"
){


html+=`

<video 
class="preview"
controls
>

<source src="${url}">

</video>

`;

}


}




html+=`

<br>


<button onclick='copyText(${JSON.stringify(url)},this)'>

Copy Raw Asset Link

</button>


</div>

`;



});



}


else{


html+=`

<p>
No assets available yet.
</p>

`;

}



html+=`

</div>

`;



box.innerHTML+=html;



});



}



</script>


</body>

</html>
