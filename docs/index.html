<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visual Assets Library</title>

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 30px;
    background: #111;
    color: white;
}

h1 {
    text-align: center;
}

input {

    width:100%;
    padding:15px;
    font-size:18px;
    border-radius:8px;
    border:none;
    margin-bottom:20px;

}


.card {

    background:#222;
    padding:20px;
    border-radius:10px;
    margin-bottom:15px;

}


.complete {

    color:#4ade80;

}


.progress {

    color:#facc15;

}


.notstarted {

    color:#aaa;

}


a {

    color:#60a5fa;

}


</style>

</head>


<body>


<h1>Visual Assets Library</h1>


<p>
Search collections, platforms, studios, franchises and networks.
</p>


<input id="search" placeholder="Search Netflix, Marvel, Disney..." onkeyup="search()">



<div id="results"></div>



<script>


let collections = [];


fetch("search.json")

.then(response => response.json())

.then(data => {

    collections = data;

});



function search(){


let value =
document
.getElementById("search")
.value
.toLowerCase();



let results =
collections.filter(item =>

item.name
.toLowerCase()
.includes(value)

||
item.category
.toLowerCase()
.includes(value)

);



display(results);



}



function display(results){


let box =
document.getElementById("results");


box.innerHTML="";



if(results.length === 0){

box.innerHTML =
"<p>No collections found.</p>";

return;

}



results.forEach(item => {



let statusClass =
item.status === "Complete"
?
"complete"
:
item.status === "Not Started"
?
"notstarted"
:
"progress";



let link = "";



if(item.status === "Complete"){


link =

<br>
<a target="_blank"
href="https://github.com/IkoMosiEntertainmentHub/Visual-Assets-Library/tree/main/${encodeURIComponent(item.path).replace(/%2F/g,'/')}">
Open Collection Folder
</a>
;

}



box.innerHTML +=



<div class="card">

<h2>${item.name}</h2>

<p>
Category:
${item.category}
</p>


<p class="${statusClass}">
Status:
${item.status}
</p>


${link}


</div>

;



});



}



</script>


</body>

</html>
