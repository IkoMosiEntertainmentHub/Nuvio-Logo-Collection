<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visual Assets Library</title>

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: auto;
    padding: 30px;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    margin-bottom: 20px;
}

.card {
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
}

.complete {
    color: green;
}

.development {
    color: orange;
}

.notstarted {
    color: gray;
}

</style>

</head>


<body>


<h1>Visual Assets Library</h1>


<input 
id="search"
placeholder="Search collections..."
>


<div id="results">
Loading...
</div>



<script>


let collections = [];



fetch("./search.json")
.then(response => {

    if (!response.ok) {
        throw new Error("search.json failed: " + response.status);
    }

    return response.json();

})
.then(data => {

    collections = data;

    console.log("Loaded:", collections);

    displayResults(collections);

})
.catch(error => {

    console.error(error);

    document.getElementById("results").innerHTML =
    "Search database failed to load.";

});





document
.getElementById("search")
.addEventListener(
"input",
function(){


    let query =
    this.value
    .toLowerCase()
    .trim();



    let filtered =
    collections.filter(item => {


        return (

            item.name
            .toLowerCase()
            .includes(query)

            ||

            item.category
            .toLowerCase()
            .includes(query)

            ||

            item.status
            .toLowerCase()
            .includes(query)

        );


    });



    displayResults(filtered);


});





function displayResults(items){


    let output =
    document.getElementById("results");


    output.innerHTML = "";



    if(items.length === 0){

        output.innerHTML =
        "<p>No collections found.</p>";

        return;

    }




    items.forEach(item => {


        let statusClass = "";


        if(item.status === "Complete"){

            statusClass = "complete";

        }

        else if(item.status === "In Development"){

            statusClass = "development";

        }

        else {

            statusClass = "notstarted";

        }




        output.innerHTML += 

        <div class="card">

        <h2>${item.name}</h2>

        <p>
        Category: ${item.category}
        </p>

        <p class="${statusClass}">
        Status: ${item.status}
        </p>


        ${
        item.status === "Complete"

        ?

        <a href="https://github.com/IkoMosiEntertainmentHub/Visual-Assets-Library/tree/main/${item.path}">
        Open Collection
        </a>

        :

        "No assets available yet"

        }


        </div>

        ;


    });


}


</script>


</body>

</html>
