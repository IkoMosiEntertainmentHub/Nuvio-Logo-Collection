<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visual Assets Library</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

font-family:Arial,sans-serif;

color:white;

padding:20px;

background:#050b18;

overflow-x:hidden;

}



body::before{

content:"";

position:fixed;

width:600px;

height:600px;

background:#0066ff;

filter:blur(150px);

opacity:.35;

top:-200px;

left:-200px;

animation:move1 12s infinite alternate;

z-index:-1;

}



body::after{

content:"";

position:fixed;

width:600px;

height:600px;

background:#00bfff;

filter:blur(150px);

opacity:.25;

bottom:-200px;

right:-200px;

animation:move2 15s infinite alternate;

z-index:-1;

}



@keyframes move1{

from{
transform:translate(0,0);
}

to{
transform:translate(300px,200px);
}

}



@keyframes move2{

from{
transform:translate(0,0);
}

to{
transform:translate(-250px,-200px);
}

}



.container{

max-width:1100px;

margin:auto;

}



h1{

font-size:38px;

}



.search-area{

display:flex;

gap:10px;

}



#search{

flex:1;

padding:15px;

border-radius:12px;

border:none;

background:#111c33;

color:white;

font-size:17px;

}



#settingsButton{

width:55px;

border-radius:12px;

border:none;

background:#0066ff;

color:white;

font-size:25px;

cursor:pointer;

}



#settingsPanel{

display:none;

position:absolute;

right:20px;

top:100px;

background:#111c33;

padding:20px;

border-radius:15px;

border:1px solid rgba(255,255,255,.2);

z-index:100;

min-width:250px;

}



#settingsPanel label{

display:block;

margin:12px 0;

}



.card{

background:rgba(20,30,55,.85);

backdrop-filter:blur(15px);

border-radius:16px;

padding:20px;

margin-top:20px;

}



.complete{

color:#00ff88;

font-weight:bold;

}



.dev{

color:#ffaa00;

font-weight:bold;

}



.asset{

background:#081226;

padding:15px;

border-radius:12px;

margin-top:15px;

}



.preview{

width:100%;

max-height:350px;

object-fit:contain;

border-radius:12px;

margin-top:10px;

}



button.copy{

width:100%;

padding:12px;

margin-top:10px;

border:none;

border-radius:10px;

background:#0066ff;

color:white;

cursor:pointer;

}



@media(max-width:600px){


body{

padding:12px;

}



h1{

font-size:28px;

}



.card{

padding:15px;

}


}



</style>

</head>



<body>


<div class="container">


<h1>
Visual Assets Library
</h1>



<div class="search-area">


<input 
id="search"
placeholder="Search collections..."
>



<button id="settingsButton">

⚙️

</button>


</div>




<div id="settingsPanel">


<h3>
Settings
</h3>


<label>

<input id="gifToggle" type="checkbox">

GIF Preview

</label>



<label>

<input id="pngToggle" type="checkbox">

PNG Preview

</label>



<label>

<input id="jpgToggle" type="checkbox">

JPG/JPEG Preview

</label>



<label>

<input id="webpToggle" type="checkbox">

WEBP Preview

</label>



<label>

<input id="mp4Toggle" type="checkbox">

MP4 Preview

</label>



</div>




<div id="results">

Loading...

</div>



</div>






<script>


let assets=[];



let settings = JSON.parse(

localStorage.getItem("VAL_settings")

)

||

{

gif:true,

png:true,

jpg:true,

webp:true,

mp4:true

};






function loadSettings(){


gifToggle.checked=settings.gif;

pngToggle.checked=settings.png;

jpgToggle.checked=settings.jpg;

webpToggle.checked=settings.webp;

mp4Toggle.checked=settings.mp4;


}





function saveSettings(){


settings={


gif:gifToggle.checked,

png:pngToggle.checked,

jpg:jpgToggle.checked,

webp:webpToggle.checked,

mp4:mp4Toggle.checked


};



localStorage.setItem(

"VAL_settings",

JSON.stringify(settings)

);



displayResults(assets);


}





document
.querySelectorAll("#settingsPanel input")
.forEach(x=>{


x.addEventListener(

"change",

saveSettings

);


});






settingsButton.onclick=function(){


let panel=document.getElementById(
"settingsPanel"
);



panel.style.display =

panel.style.display==="block"

?

"none"

:

"block";


};





fetch("search.json")


.then(response=>response.json())


.then(data=>{


assets=data;


displayResults(data);


})

.catch(error=>{


console.error(error);


results.innerHTML="Failed loading database";


});






search.addEventListener(

"input",

function(){


let q=this.value.toLowerCase();



let filtered=assets.filter(item=>


item.name.toLowerCase().includes(q)

||

item.category.toLowerCase().includes(q)

||

item.status.toLowerCase().includes(q)


);



displayResults(filtered);


});








function copyText(text,button){


navigator.clipboard.writeText(text);



button.innerText="Copied";



setTimeout(()=>{


button.innerText="Copy Raw Asset Link";


},1500);


}







function allowedPreview(ext){


if(ext==="gif")
return settings.gif;


if(ext==="png")
return settings.png;


if(ext==="jpg" || ext==="jpeg")
return settings.jpg;


if(ext==="webp")
return settings.webp;


if(ext==="mp4")
return settings.mp4;


return false;


}







function displayResults(data){


let box=document.getElementById("results");


box.innerHTML="";



data.forEach(item=>{


let html=`


<div class="card">


<h2>${item.name}</h2>


<p>
Category: ${item.category}
</p>


<p class="${item.status==="Complete"?"complete":"dev"}">

Status: ${item.status}

</p>


`;





if(item.status==="Complete"){



item.assets.forEach(url=>{


let ext=url.split(".").pop().toLowerCase();



html+=`

<div class="asset">


<h3>${ext.toUpperCase()}</h3>

`;




if(allowedPreview(ext)){



if(
ext==="gif" ||
ext==="png" ||
ext==="jpg" ||
ext==="jpeg" ||
ext==="webp"
){


html+=`

<img 
src="${url}"
class="preview"
loading="lazy"
>

`;

}



if(ext==="mp4"){


html+=`

<video class="preview" controls>

<source src="${url}">

</video>

`;

}



}



html+=`

<button class="copy" onclick='copyText(${JSON.stringify(url)},this)'>

Copy Raw Asset Link

</button>


</div>

`;



});



}

else{


html+=`

<p>
No assets available yet.
</p>

`;

}



html+=`

</div>

`;



box.innerHTML+=html;



});


}





loadSettings();


</script>


</body>

</html>
