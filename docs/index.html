<script>

let assets = [];


fetch("search.json")

.then(response => response.json())

.then(data => {

    assets = data;

    displayResults(assets);

})


.catch(error => {

    console.error(error);

    document.getElementById("results").innerHTML =
    `
    <p>
    Failed to load search database.
    </p>
    `;

});



document
.getElementById("search")
.addEventListener("input", function(){


    let query = this.value.toLowerCase().trim();


    let filtered = assets.filter(item => {


        return (

            item.name.toLowerCase().includes(query)

            ||

            item.category.toLowerCase().includes(query)

            ||

            item.status.toLowerCase().includes(query)

        );


    });


    displayResults(filtered);


});




function displayResults(results){


    let container =
    document.getElementById("results");


    container.innerHTML = "";


    if(results.length === 0){

        container.innerHTML =
        `
        <p>
        No collections found.
        </p>
        `;

        return;

    }



    results.forEach(item => {


        let statusClass = "";


        if(item.status === "Complete"){

            statusClass = "status-complete";

        }

        else if(item.status === "In Development"){

            statusClass = "status-development";

        }

        else {

            statusClass = "status-notstarted";

        }



        let link = "";


        if(item.status === "Complete"){


            link =
            `
            <p>
            <a href="https://github.com/IkoMosiEntertainmentHub/Visual-Assets-Library/tree/main/${item.path}">
            Open Collection
            </a>
            </p>
            `;


        }

        else {


            link =
            `
            <p>
            No assets available yet
            </p>
            `;


        }



        container.innerHTML +=

        `
        <div class="card">

        <h2>
        ${item.name}
        </h2>

        <p>
        Category: ${item.category}
        </p>

        <p class="${statusClass}">
        Status: ${item.status}
        </p>

        ${link}

        </div>
        `;


    });


}


</script>
