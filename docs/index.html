<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visual Assets Library</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

font-family:Arial,sans-serif;

color:white;

padding:20px;

background:#050b18;

overflow-x:hidden;

}



body::before{

content:"";

position:fixed;

width:500px;

height:500px;

background:#0066ff;

filter:blur(140px);

opacity:.35;

top:-150px;

left:-150px;

animation:move 12s infinite alternate;

z-index:-1;

}



body::after{

content:"";

position:fixed;

width:500px;

height:500px;

background:#00bfff;

filter:blur(150px);

opacity:.25;

bottom:-150px;

right:-150px;

animation:move2 15s infinite alternate;

z-index:-1;

}



@keyframes move{

from{
transform:translate(0,0);
}

to{
transform:translate(250px,150px);
}

}



@keyframes move2{

from{
transform:translate(0,0);
}

to{
transform:translate(-200px,-150px);
}

}



.container{

width:100%;

max-width:1100px;

margin:auto;

}



h1{

font-size:38px;

}



input[type=text]{

width:100%;

padding:15px;

border-radius:12px;

border:none;

background:#111c33;

color:white;

font-size:17px;

}



.settings{

background:rgba(255,255,255,.08);

padding:15px;

border-radius:15px;

margin-top:20px;

}



.settings label{

display:block;

margin:10px 0;

}



.card{

background:rgba(20,30,55,.85);

backdrop-filter:blur(15px);

border-radius:16px;

padding:20px;

margin-top:20px;

border:1px solid rgba(255,255,255,.1);

}



.complete{

color:#00ff88;

font-weight:bold;

}



.dev{

color:#ffaa00;

font-weight:bold;

}



.asset{

background:#081226;

padding:15px;

border-radius:12px;

margin-top:15px;

}



.preview{

width:100%;

max-height:350px;

object-fit:contain;

border-radius:12px;

margin-top:10px;

}



button{

width:100%;

background:#0066ff;

color:white;

border:none;

padding:12px;

border-radius:10px;

cursor:pointer;

font-size:15px;

}



button:hover{

background:#008cff;

}




@media(max-width:600px){


body{

padding:12px;

}



h1{

font-size:28px;

}



.card{

padding:15px;

}



.asset{

padding:12px;

}



}



</style>

</head>


<body>


<div class="container">


<h1>
Visual Assets Library
</h1>


<input 
id="search"
type="text"
placeholder="Search collections..."
>



<div class="settings">


<h3>
Preview Settings
</h3>


<label>
<input id="gifToggle" type="checkbox" checked>
Enable GIF Preview
</label>


<label>
<input id="pngToggle" type="checkbox" checked>
Enable PNG Preview
</label>


<label>
<input id="jpgToggle" type="checkbox" checked>
Enable JPG/JPEG Preview
</label>


<label>
<input id="webpToggle" type="checkbox" checked>
Enable WEBP Preview
</label>


<label>
<input id="mp4Toggle" type="checkbox" checked>
Enable MP4 Preview
</label>


</div>



<div id="results">
Loading...
</div>



</div>




<script>


let assets=[];


let settings={

gif:true,

png:true,

jpg:true,

webp:true,

mp4:true

};





fetch("search.json")


.then(r=>r.json())


.then(data=>{


assets=data;


displayResults(data);


})

.catch(()=>{


document.getElementById("results").innerHTML=
"Failed loading database";


});





function updateSettings(){


settings.gif=document.getElementById("gifToggle").checked;

settings.png=document.getElementById("pngToggle").checked;

settings.jpg=document.getElementById("jpgToggle").checked;

settings.webp=document.getElementById("webpToggle").checked;

settings.mp4=document.getElementById("mp4Toggle").checked;


displayResults(assets);


}



document.querySelectorAll(".settings input")
.forEach(x=>{


x.addEventListener(
"change",
updateSettings
);


});





document
.getElementById("search")
.addEventListener(
"input",
function(){


let q=this.value.toLowerCase();



let filtered=assets.filter(item=>


item.name.toLowerCase().includes(q)

||

item.category.toLowerCase().includes(q)

||

item.status.toLowerCase().includes(q)


);


displayResults(filtered);



});






function copyText(text,button){


navigator.clipboard.writeText(text);


button.innerText="Copied";


setTimeout(()=>{

button.innerText="Copy Raw Asset Link";

},1500);


}





function allowedPreview(ext){


if(ext==="gif")
return settings.gif;


if(ext==="png")
return settings.png;


if(ext==="jpg" || ext==="jpeg")
return settings.jpg;


if(ext==="webp")
return settings.webp;


if(ext==="mp4")
return settings.mp4;


return false;


}





function displayResults(data){


let box=document.getElementById("results");


box.innerHTML="";



data.forEach(item=>{


let html=`


<div class="card">


<h2>${item.name}</h2>


<p>
Category: ${item.category}
</p>


<p class="${item.status==="Complete"?"complete":"dev"}">

Status: ${item.status}

</p>


`;




if(item.status==="Complete"){



item.assets.forEach(url=>{


let ext=url.split(".").pop().toLowerCase();


html+=`

<div class="asset">

<h3>
${ext.toUpperCase()}
</h3>

`;



if(allowedPreview(ext)){



if(
ext==="png" ||
ext==="jpg" ||
ext==="jpeg" ||
ext==="webp" ||
ext==="gif"
){


html+=`

<img 
src="${url}"
class="preview"
loading="lazy"
>

`;

}



if(ext==="mp4"){


html+=`

<video class="preview" controls>

<source src="${url}">

</video>

`;

}



}



html+=`

<button onclick='copyText(${JSON.stringify(url)},this)'>

Copy Raw Asset Link

</button>


</div>

`;



});



}

else{


html+=`

<p>
No assets available yet.
</p>

`;

}



html+=`

</div>

`;



box.innerHTML+=html;



});


}



</script>


</body>

</html>
