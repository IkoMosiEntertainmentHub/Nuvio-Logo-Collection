<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visual Assets Library</title>

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: auto;
    padding: 30px;
    background: #111;
    color: white;
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    margin-bottom: 20px;
}

.card {
    background: #222;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 10px;
}

.complete {
    color: #4ade80;
}

.progress {
    color: #facc15;
}

.notstarted {
    color: #aaa;
}

a {
    color: #60a5fa;
}

</style>

</head>


<body>


<h1>Visual Assets Library</h1>


<p>
Search streaming platforms, TV collections, studios, franchises, networks and other collections.
</p>


<input 
id="search"
placeholder="Search Netflix, Marvel, Disney..."
oninput="searchAssets()"
>


<div id="results"></div>



<script>


let assets = [];



fetch("./search.json")
.then(response => response.json())
.then(data => {

    assets = data;

    displayResults(assets);

})
.catch(error => {

    document.getElementById("results").innerHTML =
    "<p>Unable to load collection database.</p>";

});





function searchAssets() {


    let query =
    document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();



    let results = assets.filter(item => {


        return (

            item.name
            .toLowerCase()
            .includes(query)

            ||

            item.category
            .toLowerCase()
            .includes(query)

            ||

            item.status
            .toLowerCase()
            .includes(query)

        );


    });



    displayResults(results);


}





function displayResults(results) {


    const container =
    document.getElementById("results");


    container.innerHTML = "";



    if(results.length === 0) {

        container.innerHTML =
        "<p>No collections found.</p>";

        return;

    }




    results.forEach(item => {



        let statusClass = "notstarted";


        if(item.status === "Complete") {

            statusClass = "complete";

        }

        else if(
            item.status === "In development" ||
            item.status === "In Development"
        ) {

            statusClass = "progress";

        }




        let folder = "";



        if(item.status === "Complete") {


            folder = 

            <br>

            <a target="_blank"
            href="https://github.com/IkoMosiEntertainmentHub/Visual-Assets-Library/tree/main/${item.path}">
            Open Collection Folder
            </a>

            ;


        }



        container.innerHTML += 


        <div class="card">


        <h2>
        ${item.name}
        </h2>


        <p>
        Category:
        ${item.category}
        </p>


        <p class="${statusClass}">
        Status:
        ${item.status}
        </p>


        ${folder}


        </div>


        ;


    });


}



</script>


</body>

</html>
