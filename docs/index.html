<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visual Assets Library</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 30px;
}

input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-bottom: 20px;
}

.result {
    border: 1px solid #ddd;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 8px;
}

.complete {
    color: green;
}

.development {
    color: orange;
}

.notstarted {
    color: gray;
}
</style>

</head>


<body>

<h1>Visual Assets Library</h1>

<input id="search" placeholder="Search collections...">

<div id="results">
Loading...
</div>


<script>

let assets = [];


fetch("search.json")

.then(response => response.json())

.then(data => {

    assets = data;

    showResults(assets);

})


.catch(error => {

    console.error(error);

    document.getElementById("results").innerHTML =
    "Failed to load collection database.";

});



document
.getElementById("search")
.addEventListener("input", function(){


    let query = this.value.toLowerCase();


    let filtered = assets.filter(item =>

        item.name.toLowerCase().includes(query) ||

        item.category.toLowerCase().includes(query)

    );


    showResults(filtered);


});



function showResults(items){


    let container =
    document.getElementById("results");


    container.innerHTML = "";


    if(items.length === 0){

        container.innerHTML =
        "No collections found.";

        return;

    }


    items.forEach(item => {


        let statusClass =
        item.status
        .toLowerCase()
        .replace(" ","");



        container.innerHTML += `

        <div class="result">

        <h3>${item.name}</h3>

        <p>
        Category: ${item.category}
        </p>

        <p class="${statusClass}">
        Status: ${item.status}
        </p>


        ${
            item.status === "Complete"

            ?

            `<a href="https://github.com/IkoMosiEntertainmentHub/Visual-Assets-Library/tree/main/${item.path}">
            Open Collection
            </a>`

            :

            `No assets available yet`

        }


        </div>

        `;


    });


}


</script>


</body>

</html>
