<!DOCTYPE html>
<html>

<head>

<title>Visual Assets Library</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {

font-family: Arial;
max-width:900px;
margin:auto;
padding:30px;

}


input {

width:100%;
padding:15px;
font-size:18px;

}


.card {

border:1px solid #ccc;
padding:15px;
margin-top:15px;
border-radius:10px;

}


.complete {

color:green;

}


.dev {

color:orange;

}


.none {

color:gray;

}

</style>


</head>


<body>


<h1>
Visual Assets Library
</h1>


<input
id="search"
placeholder="Search collections..."
>


<div id="results"></div>



<script>


let data = [];



fetch("./search.json")

.then(r => r.json())

.then(json => {

data = json;

display(data);

});





document
.getElementById("search")
.addEventListener(
"input",
function(){


let q =
this.value
.toLowerCase();



let results =
data.filter(x =>

x.name
.toLowerCase()
.includes(q)

||

x.category
.toLowerCase()
.includes(q)

);



display(results);


});





function display(items){


let box =
document.getElementById("results");


box.innerHTML="";



items.forEach(x=>{


let cls =
x.status=="Complete"
?
"complete"
:
x.status=="In Development"
?
"dev"
:
"none";



box.innerHTML += 


<div class="card">


<h2>${x.name}</h2>


<p>
Category: ${x.category}
</p>


<p class="${cls}">
Status: ${x.status}
</p>


${
x.status=="Complete"
?
<a href="https://github.com/IkoMosiEntertainmentHub/Visual-Assets-Library/tree/main/${x.path}">
Open Folder
</a>
:
"No assets available yet"
}



</div>


;



});


}



</script>


</body>

</html>
