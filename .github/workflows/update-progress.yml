name: Update Collection Progress

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate collection progress
        shell: python
        run: |
          import json
          import os
          import re

          CONFIG_FILE = "progress.json"
          README_FILE = "README.md"

          # These are the actual collection folders in the repository.
          COLLECTION_ROOT = "."

          # Files considered valid visual assets.
          ASSET_EXTENSIONS = {
              ".png",
              ".jpg",
              ".jpeg",
              ".webp",
              ".gif",
              ".svg",
              ".avif",
              ".bmp",
              ".ico",
              ".tif",
              ".tiff"
          }

          def normalize(name):
              name = name.lower().strip()
              name = name.replace("&", "and")
              name = name.replace("+", "plus")
              name = re.sub(r"[^a-z0-9]+", "", name)
              return name

          def contains_asset(folder):
              """
              Returns True if the folder contains at least one
              supported visual asset, including assets inside
              nested folders.
              """

              if not os.path.isdir(folder):
                  return False

              for root, dirs, files in os.walk(folder):

                  # Ignore Git metadata if encountered.
                  dirs[:] = [
                      d for d in dirs
                      if d != ".git"
                  ]

                  for filename in files:

                      extension = os.path.splitext(
                          filename
                      )[1].lower()

                      if extension in ASSET_EXTENSIONS:
                          return True

              return False

          with open(
              CONFIG_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              categories = json.load(f)

          rows = []

          for category, expected_items in categories.items():

              category_path = os.path.join(
                  COLLECTION_ROOT,
                  category
              )

              completed = 0
              total = len(expected_items)

              for item in expected_items:

                  item_path = os.path.join(
                      category_path,
                      item
                  )

                  # The item is complete ONLY when:
                  #
                  # 1. Its folder exists
                  # 2. The folder contains at least one asset
                  #
                  if contains_asset(item_path):
                      completed += 1

              if total == 0:

                  percentage = 0
                  progress_bar = "░" * 10
                  status = "Not configured"

              else:

                  percentage = round(
                      (completed / total) * 100,
                      1
                  )

                  filled = round(
                      percentage / 10
                  )

                  filled = min(
                      filled,
                      10
                  )

                  empty = 10 - filled

                  progress_bar = (
                      "█" * filled +
                      "░" * empty
                  )

                  if percentage == 100:
                      status = "Complete"

                  elif percentage >= 75:
                      status = "Nearly complete"

                  elif percentage >= 50:
                      status = "In progress"

                  elif percentage > 0:
                      status = "In development"

                  else:
                      status = "Not started"

              rows.append({
                  "category": category,
                  "completed": completed,
                  "total": total,
                  "percentage": percentage,
                  "progress_bar": progress_bar,
                  "status": status
              })

          # Read README
          with open(
              README_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              readme = f.read()

          start_marker = (
              "<!-- COLLECTION_PROGRESS_START -->"
          )

          end_marker = (
              "<!-- COLLECTION_PROGRESS_END -->"
          )

          table = []

          table.append(start_marker)
          table.append("")
          table.append(
              "| Category | Completed | Total | Progress | Status |"
          )
          table.append(
              "| --- | ---: | ---: | --- | --- |"
          )

          for row in rows:

              percentage = (
                  f"{row['percentage']:g}%"
              )

              table.append(
                  f"| **{row['category']}** "
                  f"| {row['completed']} "
                  f"| {row['total']} "
                  f"| `{row['progress_bar']}` "
                  f"**{percentage}** "
                  f"| {row['status']} |"
              )

          table.append("")
          table.append(end_marker)

          generated = "\n".join(table)

          pattern = re.compile(
              re.escape(start_marker)
              + r".*?"
              + re.escape(end_marker),
              re.DOTALL
          )

          if pattern.search(readme):

              readme = pattern.sub(
                  generated,
                  readme
              )

          else:

              section = (
                  "\n\n"
                  "## 📊 Collection Progress\n\n"
                  "Progress is automatically calculated "
                  "by checking whether each collection folder "
                  "contains at least one visual asset.\n\n"
                  + generated
                  + "\n"
              )

              readme += section

          # Write README
          with open(
              README_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(readme)

          print(
              "Collection progress calculated successfully."
          )

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes needed."
            exit 0
          fi

          git commit -m "Update collection progress"
          git push