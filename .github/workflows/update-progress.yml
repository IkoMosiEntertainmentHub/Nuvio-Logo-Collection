name: Update Collection Progress


on:

  push:

    branches:

      - main


  workflow_dispatch:




permissions:

  contents: write






jobs:


  update-progress:



    runs-on: ubuntu-latest





    steps:




      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0






      - name: Generate progress and search database

        shell: python

        run: |


          import json

          import os

          import re

          from urllib.parse import quote





          CONFIG_FILE = "collections.json"

          README_FILE = "README.md"

          PROGRESS_FILE = "progress.json"

          SEARCH_FILE = "docs/search.json"





          REPO = "IkoMosiEntertainmentHub/Visual-Assets-Library"






          ASSET_EXTENSIONS = {


              ".png",

              ".gif",

              ".jpg",

              ".jpeg",

              ".webp",

              ".svg",

              ".avif",

              ".mp4"


          }







          def find_assets(folder):


              assets=[]



              if not os.path.isdir(folder):

                  return assets






              for root,dirs,files in os.walk(folder):


                  dirs[:]=[

                      d for d in dirs

                      if d != ".git"

                  ]




                  for filename in files:


                      ext=os.path.splitext(filename)[1].lower()



                      if ext in ASSET_EXTENSIONS:


                          full=os.path.join(

                              root,

                              filename

                          )



                          relative=os.path.relpath(

                              full

                          ).replace("\\","/")





                          url=(

                              "https://raw.githubusercontent.com/"

                              + REPO

                              + "/refs/heads/main/"

                              + "/".join(

                                  quote(part)

                                  for part in relative.split("/")

                              )

                          )



                          assets.append(url)





              return sorted(assets)










          with open(

              CONFIG_FILE,

              "r",

              encoding="utf-8"

          ) as file:


              collections=json.load(file)









          progress={}

          search=[]







          for category,items in collections.items():



              completed=0


              item_data={}





              for item in items:



                  path=os.path.join(

                      category,

                      item

                  )




                  assets=find_assets(path)






                  if len(assets)>0:


                      status="Complete"

                      completed+=1





                  elif os.path.isdir(path):


                      status="Collecting"






                  else:


                      status="Not Started"








                  item_data[item]={


                      "complete":

                      status=="Complete",


                      "status":

                      status



                  }







                  search.append({


                      "name":item,


                      "category":category,


                      "status":status,


                      "path":

                      path.replace("\\","/"),


                      "assets":assets



                  })









              total=len(items)



              percentage=(

                  round(

                      (completed/total)*100,

                      1

                  )

                  if total

                  else 0

              )








              if percentage==100:


                  category_status="Complete"



              elif percentage>0:


                  category_status="Collecting"



              else:


                  category_status="Not Started"









              progress[category]={


                  "completed":completed,


                  "total":total,


                  "percentage":percentage,


                  "status":category_status,


                  "items":item_data



              }









          os.makedirs(

              "docs",

              exist_ok=True

          )









          with open(

              PROGRESS_FILE,

              "w",

              encoding="utf-8"

          ) as file:


              json.dump(

                  progress,

                  file,

                  indent=2,

                  ensure_ascii=False

              )



              file.write("\n")










          with open(

              SEARCH_FILE,

              "w",

              encoding="utf-8"

          ) as file:


              json.dump(

                  search,

                  file,

                  indent=2,

                  ensure_ascii=False

              )



              file.write("\n")










          START="<!-- COLLECTION_PROGRESS_START -->"

          END="<!-- COLLECTION_PROGRESS_END -->"








          if os.path.exists(README_FILE):



              with open(

                  README_FILE,

                  "r",

                  encoding="utf-8"

              ) as file:


                  readme=file.read()





              table=[START,""]


              table.append(

                  "| Category | Completed | Total | Progress | Status |"

              )


              table.append(

                  "| --- | ---: | ---: | --- | --- |"

              )






              for category,data in progress.items():



                  filled=round(

                      data["percentage"]/10

                  )



                  bar=(

                      "█"*filled

                      +

                      "░"*(10-filled)

                  )



                  table.append(

                      f"| **{category}** | "

                      f"{data['completed']} | "

                      f"{data['total']} | "

                      f"`{bar}` **{data['percentage']}%** | "

                      f"{data['status']} |"

                  )





              table.append("")

              table.append(END)







              section="\n".join(table)





              pattern=re.compile(

                  re.escape(START)

                  +

                  r".*?"

                  +

                  re.escape(END),

                  re.DOTALL

              )






              readme=pattern.sub(

                  section,

                  readme

              )





              with open(

                  README_FILE,

                  "w",

                  encoding="utf-8"

              ) as file:


                  file.write(readme)






      - name: Commit generated files


        shell: bash


        run: |


          git config user.name "github-actions[bot]"


          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"




          git add README.md progress.json docs/search.json





          if git diff --cached --quiet; then


              echo "No changes"


              exit 0


          fi





          git commit -m "Update collection progress and search database"





          git push
