name: Update Collection Progress

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: write


jobs:

  update-progress:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Generate progress and search database
        shell: python
        run: |

          import json
          import os
          import re


          CONFIG_FILE = "collections.json"
          PROGRESS_FILE = "progress.json"
          README_FILE = "README.md"
          SEARCH_FILE = "docs/search.json"


          ASSET_EXTENSIONS = {
              ".png",
              ".gif",
              ".jpg",
              ".jpeg",
              ".webp",
              ".svg",
              ".avif"
          }


          START_MARKER = "<!-- COLLECTION_PROGRESS_START -->"
          END_MARKER = "<!-- COLLECTION_PROGRESS_END -->"



          def folder_has_asset(folder):

              if not os.path.isdir(folder):
                  return False


              for root, dirs, files in os.walk(folder):

                  dirs[:] = [
                      d for d in dirs
                      if d != ".git"
                  ]


                  for filename in files:

                      extension = os.path.splitext(filename)[1].lower()

                      if extension in ASSET_EXTENSIONS:
                          return True


              return False




          with open(CONFIG_FILE, "r", encoding="utf-8") as file:
              collections = json.load(file)




          progress = {}
          search_database = []



          for category, items in collections.items():

              completed = 0
              item_results = {}


              for item in items:


                  path = os.path.join(
                      category,
                      item
                  )


                  has_asset = folder_has_asset(path)



                  if has_asset:

                      completed += 1
                      status = "Complete"

                  elif os.path.isdir(path):

                      status = "In Development"

                  else:

                      status = "Not Started"




                  item_results[item] = {

                      "complete": has_asset,

                      "status": status

                  }




                  search_database.append({

                      "name": item,

                      "category": category,

                      "status": status,

                      "path": path

                  })





              total = len(items)



              percentage = round(
                  (completed / total) * 100,
                  1
              ) if total else 0




              if percentage == 100:

                  category_status = "Complete"

              elif percentage > 0:

                  category_status = "In Development"

              else:

                  category_status = "Not Started"





              progress[category] = {

                  "completed": completed,

                  "total": total,

                  "percentage": percentage,

                  "status": category_status,

                  "items": item_results

              }





          os.makedirs(
              "docs",
              exist_ok=True
          )




          with open(PROGRESS_FILE, "w", encoding="utf-8") as file:

              json.dump(
                  progress,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

              file.write("\n")





          with open(SEARCH_FILE, "w", encoding="utf-8") as file:

              json.dump(
                  search_database,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

              file.write("\n")





          with open(README_FILE, "r", encoding="utf-8") as file:

              readme = file.read()





          table = [
              START_MARKER,

              "",

              "| Category | Completed | Total | Progress | Status |",

              "| --- | ---: | ---: | --- | --- |"

          ]





          for category, data in progress.items():


              filled = round(
                  data["percentage"] / 10
              )


              progress_bar = (

                  "█" * filled

                  +

                  "░" * (10 - filled)

              )



              table.append(

                  f"| {category} | "
                  f"{data['completed']} | "
                  f"{data['total']} | "
                  f"{progress_bar} {data['percentage']}% | "
                  f"{data['status']} |"

              )





          table.append("")
          table.append(END_MARKER)



          new_table = "\n".join(table)




          pattern = re.compile(

              re.escape(START_MARKER)

              +

              r".*?"

              +

              re.escape(END_MARKER),

              re.DOTALL

          )




          readme = pattern.sub(
              new_table,
              readme
          )





          with open(README_FILE, "w", encoding="utf-8") as file:

              file.write(readme)



      - name: Commit generated files

        shell: bash

        run: |


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add README.md progress.json docs/search.json



          if git diff --cached --quiet; then

            echo "No changes"

            exit 0

          fi



          git commit -m "Update collection progress and search database"

          git push