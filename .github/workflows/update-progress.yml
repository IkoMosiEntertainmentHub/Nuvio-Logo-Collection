name: Update Collection Progress

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: write


jobs:

  update-progress:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Generate progress and search database
        shell: python
        run: |

          import json
          import os
          import re
          from urllib.parse import quote



          CONFIG_FILE = "collections.json"

          PROGRESS_FILE = "progress.json"

          README_FILE = "README.md"

          SEARCH_FILE = "docs/search.json"



          REPO = "IkoMosiEntertainmentHub/Visual-Assets-Library"



          ASSET_EXTENSIONS = {

              ".png",
              ".gif",
              ".jpg",
              ".jpeg",
              ".webp",
              ".svg",
              ".avif"

          }



          START_MARKER = "<!-- COLLECTION_PROGRESS_START -->"

          END_MARKER = "<!-- COLLECTION_PROGRESS_END -->"





          def find_assets(folder):

              assets = []


              if not os.path.isdir(folder):

                  return assets



              for root, dirs, files in os.walk(folder):

                  dirs[:] = [

                      d for d in dirs

                      if d != ".git"

                  ]



                  for filename in files:


                      extension = os.path.splitext(filename)[1].lower()



                      if extension in ASSET_EXTENSIONS:


                          full_path = os.path.join(

                              root,

                              filename

                          )



                          relative = os.path.relpath(

                              full_path

                          ).replace("\\","/")



                          url = (

                              "https://raw.githubusercontent.com/"

                              + REPO

                              + "/refs/heads/main/"

                              + "/".join(

                                  quote(part)

                                  for part in relative.split("/")

                              )

                          )



                          assets.append(url)



              return assets





          with open(CONFIG_FILE, "r", encoding="utf-8") as file:

              collections = json.load(file)





          progress = {}

          search_database = []





          for category, items in collections.items():


              completed = 0

              item_results = {}



              for item in items:



                  path = os.path.join(

                      category,

                      item

                  )



                  assets = find_assets(path)



                  if len(assets) > 0:


                      completed += 1

                      status = "Complete"



                  elif os.path.isdir(path):


                      status = "In Development"



                  else:


                      status = "Not Started"





                  item_results[item] = {


                      "complete": len(assets) > 0,

                      "status": status


                  }





                  search_database.append({


                      "name": item,


                      "category": category,


                      "status": status,


                      "path": path.replace("\\","/"),


                      "assets": assets


                  })





              total = len(items)



              percentage = round(

                  (completed / total) * 100,

                  1

              ) if total else 0





              if percentage == 100:


                  category_status = "Complete"



              elif percentage > 0:


                  category_status = "In Development"



              else:


                  category_status = "Not Started"





              progress[category] = {


                  "completed": completed,


                  "total": total,


                  "percentage": percentage,


                  "status": category_status,


                  "items": item_results


              }





          os.makedirs(

              "docs",

              exist_ok=True

          )





          with open(PROGRESS_FILE, "w", encoding="utf-8") as file:


              json.dump(

                  progress,

                  file,

                  indent=2,

                  ensure_ascii=False

              )


              file.write("\n")





          with open(SEARCH_FILE, "w", encoding="utf-8") as file:


              json.dump(

                  search_database,

                  file,

                  indent=2,

                  ensure_ascii=False

              )


              file.write("\n")





          with open(README_FILE, "r", encoding="utf-8") as file:

              readme = file.read()





          table = []


          table.append(START_MARKER)

          table.append("")


          table.append("| Category | Completed | Total | Progress | Status |")

          table.append("| --- | ---: | ---: | --- | --- |")





          for category, data in progress.items():


              filled = round(

                  data["percentage"] / 10

              )


              bar = (

                  "█" * filled

                  +

                  "░" * (10 - filled)

              )



              table.append(

                  f"| **{category}** | "

                  f"{data['completed']} | "

                  f"{data['total']} | "

                  f"`{bar}` **{data['percentage']}%** | "

                  f"{data['status']} |"

              )





          table.append("")

          table.append(END_MARKER)





          new_section = "\n".join(table)





          pattern = re.compile(

              re.escape(START_MARKER)

              +

              r".*?"

              +

              re.escape(END_MARKER),

              re.DOTALL

          )





          readme = pattern.sub(

              new_section,

              readme

          )





          with open(README_FILE, "w", encoding="utf-8") as file:

              file.write(readme)





      - name: Commit generated files

        shell: bash

        run: |


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add README.md progress.json docs/search.json



          if git diff --cached --quiet; then

              echo "No changes"

              exit 0

          fi



          git commit -m "Update collection progress and search database"



          git push