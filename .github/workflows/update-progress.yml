category_status = "In Development"



              else:


                  category_status = "Not Started"







              progress[category] = {



                  "completed": completed,


                  "total": total,


                  "percentage": percentage,


                  "status": category_status,


                  "items": item_results


              }







          os.makedirs(
              "docs",
              exist_ok=True
          )







          with open(

              PROGRESS_FILE,

              "w",

              encoding="utf-8"

          ) as file:



              json.dump(

                  progress,

                  file,

                  indent=2,

                  ensure_ascii=False

              )

              file.write("\n")







          with open(

              SEARCH_FILE,

              "w",

              encoding="utf-8"

          ) as file:



              json.dump(

                  search_database,

                  file,

                  indent=2,

                  ensure_ascii=False

              )

              file.write("\n")








          with open(

              README_FILE,

              "r",

              encoding="utf-8"

          ) as file:


              readme = file.read()








          table = []


          table.append(START_MARKER)

          table.append("")

          table.append("| Category | Completed | Total | Progress | Status |")

          table.append("| --- | ---: | ---: | --- | --- |")





          for category, data in progress.items():


              filled = round(

                  data["percentage"] / 10

              )



              bar = (

                  "█" * filled

                  +

                  "░" * (10-filled)

              )



              table.append(

                  f"| {category} | "

                  f"{data['completed']} | "

                  f"{data['total']} | "

                  f"{bar} {data['percentage']}% | "

                  f"{data['status']} |"

              )






          table.append("")

          table.append(END_MARKER)





          new_section = "\n".join(table)





          pattern = re.compile(

              re.escape(START_MARKER)

              +

              r".*?"

              +

              re.escape(END_MARKER),

              re.DOTALL

          )





          readme = pattern.sub(

              new_section,

              readme

          )







          with open(

              README_FILE,

              "w",

              encoding="utf-8"

          ) as file:


              file.write(readme)








