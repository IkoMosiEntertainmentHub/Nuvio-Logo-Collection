filled = round(
                data["percentage"] / 10
            )


            bar = (
                "█" * filled
                +
                "░" * (10-filled)
            )


            table.append(

                f"| {category} | "
                f"{data['completed']} | "
                f"{data['total']} | "
                f"{bar} {data['percentage']}% | "
                f"{data['status']} |"

            )



        table.append("")

        table.append(END)



        new_section = "\n".join(table)



        pattern = re.compile(

            re.escape(START)
            +
            r".*?"
            +
            re.escape(END),

            re.DOTALL

        )



        readme = pattern.sub(
            new_section,
            readme
        )



        with open(
            README,
            "w",
            encoding="utf-8"
        ) as f:

            f.write(readme)





